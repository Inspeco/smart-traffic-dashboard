<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Traffic Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f7fa;
    }
    h1 { text-align: center; }
    .status { text-align: center; margin-bottom: 20px; }
    .sensors, .insights, .anomalies {
      margin: 20px auto;
      max-width: 900px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .sensor-card {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
    .sensor-card:last-child { border-bottom: none; }
    .anomaly { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🚦 Smart Traffic Dashboard</h1>
  <div class="status">
    <span id="statusText">Loading data...</span>
  </div>

  <div class="insights">
    <h2>AI Insights</h2>
    <pre id="aiInsights">-</pre>
  </div>

  <div class="sensors">
    <h2>Live Sensors</h2>
    <div id="sensorList">-</div>
  </div>

  <div class="anomalies">
    <h2>Anomalies</h2>
    <div id="anomaliesList">-</div>
  </div>

<script>
const API_URL = "https://smarttrafficbiphin-hqeadtdjfwe8ehb4.westeurope-01.azurewebsites.net/api/GetTrafficInsights";

async function loadData() {
  document.getElementById("statusText").textContent = "⏳ Updating...";

  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    document.getElementById("statusText").textContent =
      "✅ Data source: " + data.dataSource + " • " + new Date(data.timestamp).toLocaleString();

    // Render insights
    document.getElementById("aiInsights").textContent = JSON.stringify(data.aiInsights, null, 2);

    // Render sensors
    const sensorHTML = data.sensors.map(s => `
      <div class="sensor-card">
        <strong>${s.location}</strong> (ID: ${s.sensorId})<br>
        Speed: ${s.speed} km/h • Vehicles: ${s.vehicleCount} • Congestion: ${s.congestionLevel}
      </div>
    `).join("");
    document.getElementById("sensorList").innerHTML = sensorHTML || "No sensors available";

    // Render anomalies
    const anomaliesHTML = (data.anomalies || []).map(a => `
      <div class="sensor-card anomaly">
        ⚠ ${a.location} (${a.anomalyType}) • Severity: ${a.severity}
      </div>
    `).join("");
    document.getElementById("anomaliesList").innerHTML = anomaliesHTML || "No anomalies";

  } catch (err) {
    document.getElementById("statusText").textContent = "❌ Error loading data: " + err;
  }
}

// Initial load + auto refresh every 15s
loadData();
setInterval(loadData, 15000);
</script>
</body>
</html>
