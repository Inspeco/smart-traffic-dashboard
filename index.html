<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Traffic Live Dashboard</title>
  <style>
    body { font-family:sans-serif; background:#f7f9fc; margin:0; padding:20px; }
    h1 { text-align:center; }
    .summary, .sensors {max-width:900px; margin:20px auto; padding:15px; background:white; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.1);}
    .sensor { border-bottom:1px solid #eee; padding:10px 0; }
    .sensor:last-child { border:0; }
    .heavy { color:red; font-weight:bold; }
    .moderate { color:orange; }
    .light { color:green; }
    .anomaly { background:#ffe0e0; padding:5px; border-radius:5px; }
  </style>
</head>
<body>
  <h1>🚦 Smart Traffic Dashboard</h1>
  <div id="status">Loading...</div>
  <div class="summary">
    <h2>Summary</h2>
    <div id="summary"></div>
  </div>
  <div class="sensors">
    <h2>Sensors</h2>
    <div id="sensors"></div>
  </div>
<script>
const API_URL = "https://smarttrafficbiphin-hqeadtdjfwe8ehb4.westeurope-01.azurewebsites.net/api/GetTrafficInsights?code=Yb16W9Nu0jltY_40x4e_I_E-pJ4gAy7kUBNejE3qNV3YAzFuVfns2Q==";

async function load() {
  document.getElementById("status").textContent = "⏳ Fetching data...";
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    document.getElementById("status").textContent = "✅ Updated: "+new Date(data.timestamp).toLocaleTimeString();

    // summary
    document.getElementById("summary").innerHTML = `
      Total Sensors: ${data.summary.totalSensors}<br>
      Average Speed: ${data.summary.averageSpeed} km/h<br>
      Average Vehicles: ${data.summary.averageVehicles}<br>
      Anomalies: ${data.summary.anomalies}
    `;

    // sensors
    document.getElementById("sensors").innerHTML = data.sensors.map(s=>`
      <div class="sensor ${s.isAnomaly ? 'anomaly':''}">
        <strong>${s.location}</strong> (ID: ${s.sensorId})<br>
        Speed: ${s.speed} km/h | Vehicles: ${s.vehicleCount}<br>
        Congestion: <span class="${s.congestionLevel.toLowerCase()}">${s.congestionLevel}</span><br>
        Weather: ${s.weatherCondition}, Road: ${s.roadCondition}, Visibility: ${s.visibility}%
      </div>
    `).join('');

  } catch(err){
    document.getElementById("status").textContent = "❌ Error: "+err;
  }
}

load();
setInterval(load, 15000); // refresh every 15s
</script>
</body>
</html>
