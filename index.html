<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Traffic Live Dashboard</title>
    <style>
        :root {
            --light-bg: #f0f3f9;
            --card-bg: #ffffff;
            --primary: #3498db;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--light-bg);
            color: var(--dark);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, var(--primary), #2980b9);
            color: white;
            text-align: center;
            padding: 1.5rem 1rem;
            box-shadow: var(--shadow);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        #status {
            font-size: 1rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .summary,
        .sensors {
            background: var(--card-bg);
            margin: 20px 0;
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .summary h2,
        .sensors h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--dark);
            border-bottom: 2px solid var(--light);
            padding-bottom: 10px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .summary-item {
            background: var(--light);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .summary-item:hover {
            transform: translateY(-5px);
        }

        .summary-item strong {
            display: block;
            font-size: 1.8em;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .summary-item span {
            font-size: 0.9em;
            color: #7f8c8d;
        }

        .sensors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        .sensor-card {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 20px;
            background: var(--card-bg);
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .sensor-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-3px);
        }

        .sensor-card.anomaly {
            border: 2px solid var(--danger);
            background: #ffecec;
        }

        .sensor-card h3 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .sensor-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .sensor-detail {
            display: flex;
            flex-direction: column;
        }

        .sensor-detail strong {
            font-size: 0.9em;
            color: #7f8c8d;
            margin-bottom: 3px;
        }

        .sensor-detail span {
            font-weight: 500;
        }

        .light {
            color: var(--success);
            font-weight: bold;
        }

        .moderate {
            color: var(--warning);
            font-weight: bold;
        }

        .heavy {
            color: var(--danger);
            font-weight: bold;
        }

        .improving {
            color: var(--success);
            font-weight: bold;
        }

        .deteriorating {
            color: var(--danger);
            font-weight: bold;
        }

        .stable {
            color: var(--primary);
            font-weight: bold;
        }

        /* Traffic Index Styles */
        .traffic-index-container {
            grid-column: 1 / -1;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: white;
            font-weight: bold;
        }

        .traffic-index.light {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }

        .traffic-index.moderate {
            background: linear-gradient(135deg, #f39c12, #d35400);
        }

        .traffic-index.heavy {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        .traffic-index-value {
            font-size: 2.5em;
            margin: 10px 0;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .summary-grid,
            .sensors-grid {
                grid-template-columns: 1fr;
            }
            
            .sensor-details {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8rem;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid var(--primary);
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .metric-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            margin-left: 5px;
        }

        .badge-success {
            background: rgba(46, 204, 113, 0.2);
            color: #27ae60;
        }

        .badge-warning {
            background: rgba(243, 156, 18, 0.2);
            color: #d35400;
        }

        .badge-danger {
            background: rgba(231, 76, 60, 0.2);
            color: #c0392b;
        }
    </style>
</head>

<body>
    <header>
        <h1>🚦 Smart Traffic Dashboard</h1>
        <div id="status">Initializing...</div>
    </header>

    <div class="container">
        <div class="summary">
            <h2>System Overview</h2>
            <div id="summary" class="summary-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading traffic data...</p>
                </div>
            </div>
        </div>

        <div class="sensors">
            <h2>Live Sensor Data</h2>
            <div id="sensors" class="sensors-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading sensor information...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://smarttrafficbiphin-hqeadtdjfwe8ehb4.westeurope-01.azurewebsites.net/api/GetTrafficInsights?code=-4rdi9I39NRfVETUI8c81Iid3iC7-E1KkqCJsYatgZa1AzFuHy5W8g==";

        async function load() {
            document.getElementById("status").textContent = "⏳ Fetching real-time data...";
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                document.getElementById("status").innerHTML = 
                    `✅ Last updated: ${new Date(data.timestamp).toLocaleTimeString()} 
                     <span class="metric-badge badge-success">Operational</span>`;

                // Traffic Index Display
                const trafficIndex = data.summary.trafficIndex;
                let trafficClass = 'light';
                if (trafficIndex > 70) {
                    trafficClass = 'heavy';
                } else if (trafficIndex > 40) {
                    trafficClass = 'moderate';
                }

                // Summary Section
                document.getElementById("summary").innerHTML = `
                    <div class="traffic-index-container traffic-index ${trafficClass}">
                        <div>OVERALL TRAFFIC INDEX</div>
                        <div class="traffic-index-value">${trafficIndex}</div>
                        <div>${trafficClass.charAt(0).toUpperCase() + trafficClass.slice(1)} Traffic Conditions</div>
                    </div>
                    
                    <div class="summary-item">
                        <strong>${data.summary.totalSensors}</strong>
                        <span>Sensors Active</span>
                    </div>
                    
                    <div class="summary-item">
                        <strong>${data.summary.averageSpeed} <small>km/h</small></strong>
                        <span>Avg Speed</span>
                    </div>
                    
                    <div class="summary-item">
                        <strong>${data.summary.averageVehicles}</strong>
                        <span>Avg Vehicles</span>
                    </div>
                    
                    <div class="summary-item">
                        <strong>${data.summary.anomalies}</strong>
                        <span>Anomalies Detected</span>
                    </div>
                    
                    <div class="summary-item">
                        <strong>${data.summary.averageResponseTime}<small>ms</small></strong>
                        <span>Avg Response Time</span>
                    </div>
                    
                    <div class="summary-item">
                        <strong>${data.summary.sensorHealth}%</strong>
                        <span>Sensor Health</span>
                    </div>
                `;

                // Sensors Section
                document.getElementById("sensors").innerHTML = data.sensors.map(s => `
                    <div class="sensor-card ${s.isAnomaly ? "anomaly" : ""}">
                        <h3>${s.location}</h3>
                        
                        <div class="sensor-details">
                            <div class="sensor-detail">
                                <strong>Speed</strong>
                                <span>${s.speed} km/h</span>
                            </div>
                            
                            <div class="sensor-detail">
                                <strong>Vehicles</strong>
                                <span>${s.vehicleCount}</span>
                            </div>
                            
                            <div class="sensor-detail">
                                <strong>Congestion</strong>
                                <span class="${s.congestionLevel.toLowerCase()}">${s.congestionLevel}</span>
                            </div>
                            
                            <div class="sensor-detail">
                                <strong>Trend</strong>
                                <span class="${s.trend}">${s.trend}</span>
                            </div>
                            
                            <div class="sensor-detail">
                                <strong>Weather</strong>
                                <span>${s.weatherCondition}</span>
                            </div>
                            
                            <div class="sensor-detail">
                                <strong>Road</strong>
                                <span>${s.roadCondition}</span>
                            </div>
                        </div>
                        
                        <div class="sensor-details">
                            <div class="sensor-detail">
                                <strong>Air Quality</strong>
                                <span>${s.airQualityIndex} AQI</span>
                            </div>
                            
                            <div class="sensor-detail">
                                <strong>Noise</strong>
                                <span>${s.noiseLevel} dB</span>
                            </div>
                            
                            <div class="sensor-detail">
                                <strong>Pedestrians</strong>
                                <span>${s.pedestrianCount}</span>
                            </div>
                            
                            <div class="sensor-detail">
                                <strong>Visibility</strong>
                                <span>${s.visibility}%</span>
                            </div>
                        </div>
                        
                        <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee;">
                            <strong>Traffic Score: <span class="metric-badge badge-${getScoreBadgeClass(s.sensorTrafficScore)}">${s.sensorTrafficScore}/100</span></strong>
                        </div>
                    </div>
                `).join("");
            } catch (err) {
                document.getElementById("status").innerHTML = 
                    `❌ Error: ${err.message} <span class="metric-badge badge-danger">Connection Failed</span>`;
                document.getElementById("summary").innerHTML = `
                    <div class="summary-item" style="grid-column: 1 / -1; text-align: center;">
                        <strong style="color: var(--danger);">Failed to load data</strong>
                        <span>Please check your connection and API endpoint</span>
                    </div>
                `;
                document.getElementById("sensors").innerHTML = "";
            }
        }

        function getScoreBadgeClass(score) {
            const s = parseInt(score);
            if (s >= 70) return 'success';
            if (s >= 40) return 'warning';
            return 'danger';
        }

        // Initial load
        load();
        
        // Refresh every 15 seconds
        setInterval(load, 15000);
    </script>
</body>
</html>
