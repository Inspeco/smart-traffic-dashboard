<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Traffic Live Dashboard</title>
    <style>
        :root {
            --light-bg: #f0f3f9;
            --card-bg: #ffffff;
            --primary: #3498db;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--light-bg);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px;
            color: var(--dark);
        }

        #status {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
            background: var(--card-bg);
            box-shadow: var(--shadow);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .summary,
        .sensors {
            margin: 20px 0;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .summary h2,
        .sensors h2 {
            margin-top: 0;
            color: var(--dark);
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .summary-item {
            background: #f9fafc;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .summary-item h3 {
            margin: 0 0 10px;
            font-size: 1em;
            color: #7f8c8d;
        }

        .summary-item .value {
            display: block;
            font-size: 2em;
            font-weight: bold;
            color: var(--dark);
        }

        .traffic-index-container {
            grid-column: 1 / -1;
        }

        .traffic-index {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.8em;
            font-weight: bold;
            color: white;
        }

        .traffic-index.light {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }

        .traffic-index.moderate {
            background: linear-gradient(135deg, #f39c12, #d35400);
        }

        .traffic-index.heavy {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        .sensors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .sensor-card {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 20px;
            background: var(--card-bg);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .sensor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .sensor-card.anomaly {
            border: 2px solid var(--danger);
            background: #ffecec;
        }

        .sensor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .sensor-header h3 {
            margin: 0;
            color: var(--dark);
        }

        .sensor-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .badge-anomaly {
            background: var(--danger);
            color: white;
        }

        .sensor-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .sensor-detail {
            margin: 5px 0;
        }

        .sensor-detail strong {
            display: block;
            font-size: 0.9em;
            color: #7f8c8d;
        }

        .sensor-value {
            font-size: 1.1em;
            font-weight: 600;
        }

        .congestion-light { color: var(--success); }
        .congestion-moderate { color: var(--warning); }
        .congestion-heavy { color: var(--danger); }

        .sensor-score {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 1.2em;
            font-weight: bold;
            color: var(--primary);
            text-align: center;
        }

        .refresh-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 10px auto;
            display: block;
        }

        .refresh-btn:hover {
            background: #2980b9;
        }

        @media (max-width: 768px) {
            .summary-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .traffic-index-container {
                grid-column: 1 / 3;
            }
            
            .sensors-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }
            
            .traffic-index-container {
                grid-column: 1;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🚦 Smart Traffic Dashboard</h1>
            <div id="status">Loading...</div>
            <button id="refresh-btn" class="refresh-btn">Refresh Data</button>
        </header>

        <section class="summary">
            <h2>Traffic Overview</h2>
            <div id="summary" class="summary-grid">
                <!-- Traffic Index Display -->
                <div class="traffic-index-container">
                    <div id="traffic-index" class="traffic-index">Calculating...</div>
                </div>
                
                <div class="summary-item">
                    <h3>Sensors Active</h3>
                    <span id="total-sensors" class="value">0</span>
                </div>
                
                <div class="summary-item">
                    <h3>Avg Speed</h3>
                    <span id="avg-speed" class="value">0</span>
                    <small>km/h</small>
                </div>
                
                <div class="summary-item">
                    <h3>Avg Vehicles</h3>
                    <span id="avg-vehicles" class="value">0</span>
                </div>
                
                <div class="summary-item">
                    <h3>Anomalies</h3>
                    <span id="anomalies" class="value">0</span>
                </div>
            </div>
        </section>

        <section class="sensors">
            <h2>Live Sensors</h2>
            <div id="sensors" class="sensors-grid"></div>
        </section>
    </div>

    <script>
        // Configuration
        const API_URL = "https://smarttrafficbiphin-hqeadtdjfwe8ehb4.westeurope-01.azurewebsites.net/api/GetTrafficInsights?code=-4rdi9I39NRfVETUI8c81Iid3iC7-E1KkqCJsYatgZa1AzFuHy5W8g==";
        const REFRESH_INTERVAL = 15000; // 15 seconds

        // DOM Elements
        const statusEl = document.getElementById("status");
        const refreshBtn = document.getElementById("refresh-btn");
        const trafficIndexEl = document.getElementById("traffic-index");
        const totalSensorsEl = document.getElementById("total-sensors");
        const avgSpeedEl = document.getElementById("avg-speed");
        const avgVehiclesEl = document.getElementById("avg-vehicles");
        const anomaliesEl = document.getElementById("anomalies");
        const sensorsEl = document.getElementById("sensors");

        // State
        let refreshInterval;

        // Helper Functions
        function updateStatus(message, isError = false) {
            statusEl.textContent = message;
            statusEl.style.backgroundColor = isError ? '#ffecec' : '#f9fafc';
            statusEl.style.color = isError ? '#c0392b' : '#2c3e50';
        }

        function getTrafficIndexClass(index) {
            if (index > 70) return 'heavy';
            if (index > 40) return 'moderate';
            return 'light';
        }

        function getCongestionClass(level) {
            return `congestion-${level.toLowerCase()}`;
        }

        // Data Processing
        async function fetchData() {
            updateStatus("⏳ Fetching data...");
            
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                updateStatus(`✅ Updated: ${new Date(data.timestamp).toLocaleTimeString()}`);
                renderDashboard(data);
            } catch (error) {
                console.error("Fetch error:", error);
                updateStatus(`❌ Error: ${error.message}`, true);
            }
        }

        function renderDashboard(data) {
            // Update summary
            const { summary, sensors } = data;
            
            // Traffic Index
            const trafficIndex = summary.trafficIndex;
            const trafficClass = getTrafficIndexClass(trafficIndex);
            trafficIndexEl.innerHTML = `Overall Traffic Index: <span class="${trafficClass}">${trafficIndex}</span>`;
            trafficIndexEl.className = `traffic-index ${trafficClass}`;
            
            // Summary items
            totalSensorsEl.textContent = summary.totalSensors;
            avgSpeedEl.textContent = summary.averageSpeed;
            avgVehiclesEl.textContent = summary.averageVehicles;
            anomaliesEl.textContent = summary.anomalies;
            
            // Sensors
            sensorsEl.innerHTML = sensors.map(sensor => `
                <div class="sensor-card ${sensor.isAnomaly ? "anomaly" : ""}">
                    <div class="sensor-header">
                        <h3>${sensor.location}</h3>
                        ${sensor.isAnomaly ? '<span class="sensor-badge badge-anomaly">ANOMALY</span>' : ''}
                    </div>
                    
                    <div class="sensor-details">
                        <div class="sensor-detail">
                            <strong>Speed</strong>
                            <span class="sensor-value">${sensor.speed} km/h</span>
                        </div>
                        
                        <div class="sensor-detail">
                            <strong>Vehicles</strong>
                            <span class="sensor-value">${sensor.vehicleCount}</span>
                        </div>
                        
                        <div class="sensor-detail">
                            <strong>Congestion</strong>
                            <span class="sensor-value ${getCongestionClass(sensor.congestionLevel)}">${sensor.congestionLevel}</span>
                        </div>
                        
                        <div class="sensor-detail">
                            <strong>Weather</strong>
                            <span class="sensor-value">${sensor.weatherCondition}</span>
                        </div>
                        
                        <div class="sensor-detail">
                            <strong>Road</strong>
                            <span class="sensor-value">${sensor.roadCondition}</span>
                        </div>
                        
                        <div class="sensor-detail">
                            <strong>Visibility</strong>
                            <span class="sensor-value">${sensor.visibility}%</span>
                        </div>
                    </div>
                    
                    <div class="sensor-score">
                        Traffic Score: ${sensor.sensorTrafficScore}
                    </div>
                </div>
            `).join("");
        }

        // Event Handlers
        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(fetchData, REFRESH_INTERVAL);
        }

        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        // Initialize
        refreshBtn.addEventListener("click", fetchData);
        
        // Initial load
        fetchData().then(() => {
            startAutoRefresh();
        });

        // Handle page visibility changes
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                stopAutoRefresh();
            } else {
                fetchData().then(startAutoRefresh);
            }
        });
    </script>
</body>
</html>
