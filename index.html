<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Traffic Live Dashboard</title>
<style>
  body { font-family:Arial, sans-serif; background:#f0f3f9; margin:0; padding:20px; }
  h1 { text-align:center; margin-bottom:10px; }
  #status { text-align:center; margin-bottom:20px; }
  .summary, .sensors { max-width:1000px; margin:20px auto; background:white; padding:20px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,.1); }
  .summary h2, .sensors h2 { margin-top:0; }
  .summary-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:15px; }
  .summary-item { background:#f9fafc; padding:15px; border-radius:8px; text-align:center; }
  .summary-item strong { display:block; font-size:1.4em; color:#2c3e50; }
  .sensors-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:15px; }
  .sensor-card { border:1px solid #eee; border-radius:10px; padding:15px; background:#fff; }
  .sensor-card.anomaly { border:2px solid red; background:#ffecec; }
  .light { color:green; font-weight:bold; }
  .moderate { color:orange; font-weight:bold; }
  .heavy { color:red; font-weight:bold; }
</style>
</head>
<body>
<h1>🚦 Smart Traffic Dashboard</h1>
<div id="status">Loading...</div>

<div class="summary">
  <h2>Summary</h2>
  <div id="summary" class="summary-grid"></div>
</div>

<div class="sensors">
  <h2>Live Sensors</h2>
  <div id="sensors" class="sensors-grid"></div>
</div>

<script>
const API_URL = "https://smarttrafficbiphin-hqeadtdjfwe8ehb4.westeurope-01.azurewebsites.net/api/GetTrafficInsights?code=-4rdi9I39NRfVETUI8c81Iid3iC7-E1KkqCJsYatgZa1AzFuHy5W8g==";

async function load() {
  document.getElementById("status").textContent = "⏳ Fetching data...";
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    document.getElementById("status").textContent =
      "✅ Updated: " + new Date(data.timestamp).toLocaleTimeString();

    // summary
    document.getElementById("summary").innerHTML = `
      <div class="summary-item"><strong>${data.summary.totalSensors}</strong>Sensors Active</div>
      <div class="summary-item"><strong>${data.summary.averageSpeed} km/h</strong>Avg Speed</div>
      <div class="summary-item"><strong>${data.summary.averageVehicles}</strong>Avg Vehicles</div>
      <div class="summary-item"><strong>${data.summary.anomalies}</strong>Anomalies</div>
    `;

    // sensors
    document.getElementById("sensors").innerHTML = data.sensors.map(s => `
      <div class="sensor-card ${s.isAnomaly ? "anomaly" : ""}">
        <h3>${s.location}</h3>
        <p><strong>Speed:</strong> ${s.speed} km/h</p>
        <p><strong>Vehicles:</strong> ${s.vehicleCount}</p>
        <p><strong>Congestion:</strong> <span class="${s.congestionLevel.toLowerCase()}">${s.congestionLevel}</span></p>
        <p><strong>Weather:</strong> ${s.weatherCondition} | <strong>Road:</strong> ${s.roadCondition}</p>
        <p><strong>Visibility:</strong> ${s.visibility}%</p>
      </div>
    `).join("");
  } catch(err) {
    document.getElementById("status").textContent = "❌ Error: " + err;
  }
}

load();
setInterval(load, 15000); // refresh every 15s
</script>
</body>
</html>
